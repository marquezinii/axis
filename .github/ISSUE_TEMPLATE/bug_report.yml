name: Relatar bug
description: Ajude a reproduzir um problema no Axis.
title: '[Bug]: '
labels: [bug]
body:
  - type: textarea
    id: behavior
    attributes:
      label: Comportamento observado
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Comportamento esperado
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Ambiente
      description: Informe versão do Axis e Windows. Não inclua caminhos pessoais ou segredos.
